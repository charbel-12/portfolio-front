# Merge into the existing HTTPS server {}. Set root to the deployed out/ directory.
# Replace the existing location / block; do not create a duplicate.
# Include the two http-level map files first (see README).

add_header Link '</.well-known/api-catalog>; rel="api-catalog", </openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json", </docs/api.md>; rel="service-doc"; type="text/markdown", </.well-known/ai-catalog.json>; rel="describedby"; type="application/json"' always;
add_header Vary Accept always;

location / {
    # Markdown assets exist only for exported pages; unknown paths remain 404.
    if ($agent_markdown_file) {
        rewrite ^ $agent_markdown_file last;
    }
    try_files $uri $uri.html $uri/ =404;
}

location = /.well-known/api-catalog {
    types { }
    default_type application/linkset+json;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
}

location = /.well-known/ai-catalog.json {
    types { }
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
}

location = /openapi.json {
    types { }
    default_type application/vnd.oai.openapi+json;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
}

# Put before generic extension regex locations. Permit /.well-known/ through
# any existing hidden-file deny rule. Keep other dotfiles denied.
location ~ \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Vary Accept always;
    add_header Cache-Control "no-store" always;
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </docs/api.md>; rel="service-doc"' always;
    try_files $uri =404;
}
