# Include inside nginx.conf's http {} BEFORE generated/markdown-map.conf.
# The server prefers Markdown whenever explicitly acceptable; wildcard Accept
# values alone never opt in. Explicit q=0 must not enable Markdown.
map $http_accept $agent_accept_markdown {
    default 0;
    "~*(?:^|,)\s*text/markdown\s*(?:;[^,]*)?;\s*q=0(?:\.0*)?\s*(?:;|,|$)" 0;
    "~*(?:^|,)\s*text/markdown\s*(?:;[^,]*)?(?:,|$)" 1;
}
